# APIA (Autonomous Project Intelligence Agent) configuration.
#
# This file is read by the off-model preprocessing scripts and referenced by the
# Tier-2 skills/agents. It carries NO secrets and never configures an external LLM
# backend: model inference always runs on the user's existing Copilot session.
# External *data* is fetched via MCP/Copilot tool-use only.

# token_budget: per-stage soft limits (approximate token counts) used to warn when
# a stage's assembled context would exceed its budget. These are advisory ceilings
# that keep each stage of the ingest -> clarify -> modify -> test -> apply loop
# token-cheap; exceeding one should trigger a warning, not a hard failure.
token_budget:
  ingest: 8000      # distilled knowledge summary returned from the forked ingest stage
  clarify: 2000     # assumptions list + numbered clarifying questions
  modify: 6000      # plan + proposed diff grounded in the knowledge base
  test: 6000        # regression + new/characterization test authoring and results
  apply: 2000       # final change summary and commit/PR preparation
  iterate: 4000     # soft per-iteration ceiling for the Layer-2 self-correction
                    # loop: assembled structured failure + the smallest grounding
                    # needed for the next fix attempt. Advisory, not a hard stop;
                    # the hard stop is max_iterations below.
  review: 4000      # soft ceiling for the Phase-2 Reviewer's model-facing
                    # summarize/prioritize stage. The off-model scan.py engine
                    # produces grounded findings for free; this budget bounds the
                    # context Copilot consumes to summarize + prioritize them
                    # (and name limitations). Advisory, not a hard stop.
  generate: 6000    # soft ceiling for the Phase-3 greenfield GENERATION stage's
                    # model-facing work (write the feature code live for the
                    # detected shape). The off-model scaffold.py engine does the
                    # deterministic work for free (shape detection, skeleton/
                    # build-file emission, build+run+test normalization, gate);
                    # this budget bounds the context Copilot consumes per
                    # generation increment. Advisory, not a hard stop; the hard
                    # stop is max_iterations below.
  orchestrate: 3000 # soft ceiling for the Phase-4 ORCHESTRATOR's model-facing
                    # work (planning the task graph from a goal, and the batched
                    # clarify/approval checkpoints). The off-model orchestrate.py
                    # engine does the deterministic work for free (graph build/
                    # validate, topological frontier, resumable run-state, global
                    # stop + audit trail); this budget bounds the context Copilot
                    # consumes per planning/checkpoint turn. Advisory, not a hard
                    # stop; the per-task hard stop is max_iterations below and the
                    # global stop is orchestrate.global_max_tasks.

# max_iterations: HARD cap on the Layer-2 self-correction loop (verifier runs ->
# model proposes a fix -> re-verify). Iteration exists to AVOID wasted tokens by
# converging quickly on grounded eval data, NOT to grind indefinitely: when the
# cap is reached without going green the loop FAILS LOUD (surfaces the last
# structured failure and stops) rather than silently continuing. The loop never
# bypasses the human gate: a change still gates at APPLY regardless of how few
# iterations it took.
max_iterations: 3

# confidence_threshold: the anti-hallucination clarify gate. If the agent's
# confidence in its understanding of the request falls below this value (0.0-1.0),
# it MUST ask numbered clarifying questions instead of guessing.
confidence_threshold: 0.75

# stacks: first-class language support. Python is the Phase-1 primary (its adapter
# is fully implemented first); C++, C#, and Groovy ship as adapter stubs and reach
# parity in Phase 2. Each entry's `adapter` points at a file under .apia/adapters/.
stacks:
  - name: python
    primary: true          # Phase-1 primary host/stack
    adapter: adapters/python.yml
  - name: cpp
    primary: false
    adapter: adapters/cpp.yml
  - name: csharp
    primary: false
    adapter: adapters/csharp.yml
  - name: groovy
    primary: false
    adapter: adapters/groovy.yml

# knowledge_dir: where the cached, committed project knowledge base lives. Ingestion
# writes compact Markdown artifacts here (project-map.md, architecture.md, etc.);
# this directory is committed so knowledge is shared across the team and survives
# sessions. Path is relative to the .apia/ directory.
knowledge_dir: knowledge/

# eval_data: Layer-1 grounded eval-data policy. The self-correction loop may only
# trust a signal that is grounded in observable project behavior, never in the
# agent's own restatement of the request. `trust_order` lists the Layer-1 signal
# kinds from MOST to LEAST trustworthy; the loop prefers a higher-trust signal
# when more than one is available:
#   characterization > golden > invariant > differential
#   - characterization: a test that pins the CURRENT observed behavior of the
#     code (most trustworthy: it is the real output of the real code).
#   - golden: a committed golden tree compared against freshly produced artifacts.
#   - invariant: a built-in structural property that must always hold
#     (e.g. row_count_matches_input, no_nans, roundtrip_identity).
#   - differential: the delta against the saved baseline (regressions vs. new).
# acceptance_criteria_gate: the anti-circularity safeguard. When true, acceptance
# criteria that describe NEW behavior (not yet exhibited by the code) must be
# human-confirmed before the loop is allowed to treat them as truth; otherwise the
# agent could "pass" by grading itself against its own guess of the requirement.
# iterate_to_best: Phase-5 ITERATE-TO-BEST knobs. The self-correction loop no
# longer stops at merely "green" (tests pass); the fused acceptance decision
# (evalloop.evaluate_quality_gated -- the ONE shared function the standalone loop,
# the greenfield generation gate and the orchestrator all call) continues toward
# "green tests AND the reviewer gate meets the configured review.thresholds"
# (see the `review:` block below -- that SAME severity gate IS the quality bar;
# tune "best" there). The loop is still bounded by `max_iterations` above: on the
# cap it STOPS and asks, presenting the BEST attempt reached (fewest/lowest-
# severity residual findings + fewest failing verify phases), never the last.
# "best" means "meets the user-configured deterministic thresholds, or the
# closest bounded attempt with an honest residual report" -- NOT a guarantee of
# globally optimal code (the ceiling is still the Copilot model, the tests, and
# what the scanners detect).
#   best_so_far_tie_break  how to choose between two attempts that rank EQUALLY on
#                          residual severity + failing-phase count:
#                          fewest_findings (default) | latest | earliest.
eval_data:
  trust_order:
    - characterization
    - golden
    - invariant
    - differential
  acceptance_criteria_gate: true
  iterate_to_best:
    best_so_far_tie_break: fewest_findings

# review: Phase-2 Reviewer policy + the COMPOSABLE severity gate. The off-model
# scanner engine (.apia/scripts/scan.py) runs the per-stack scanners declared in
# each adapter's `scanners:` section, normalizes their output into one canonical
# finding shape {severity, category, file, line, rule, message, source_tool},
# and calls apply_thresholds(findings, review.thresholds) to decide whether the
# gate passes. The standalone reviewer, the greenfield-generation gate AND the
# Phase-5 iterate-to-best eval-loop fusion all read this SAME `thresholds` block
# via the one shared evalloop.evaluate_quality_gated, so the gate is composable
# without rework and "best" means the same thing everywhere -- tune the quality
# bar HERE. The severity vocabulary is ordered: critical > high > medium > low >
# info.
#   thresholds.fail_on_severity  any finding at this severity or MORE severe
#                                fails the gate (e.g. `high` fails on high +
#                                critical).
#   thresholds.max_findings      optional per-category caps (security/quality/
#                                perf) and an optional `total` cap; a category
#                                over its cap fails the gate with a specific
#                                reason. Here security is capped at 0 (any known
#                                vulnerability or security smell fails).
review:
  thresholds:
    fail_on_severity: high
    max_findings:
      security: 0

# generate: Phase-3 greenfield PROJECT GENERATION policy. APIA generates a
# working, tested, runnable Python OR C++ project from an APPROVED spec using a
# two-tier, HONEST model (never a faked green). The off-model generation engine
# (.apia/scripts/scaffold.py) reads `supported_shapes` below REPO-FIRST (the
# target repo's own .apia/config.yml wins, then this package config), falling
# back to its built-in default only when the key is absent -- so this block is
# the AUTHORITATIVE source of the detectable shapes. The shape names must match
# the ids scaffold.py uses exactly.
#
# supported_shapes is split into two tiers so "any Python/C++ project" is honest:
#   TIER 1 -- fully-verifiable: python_cli, python_library, python_web_api,
#             cpp_console, cpp_library. These are deterministically built + run +
#             unit-tested end-to-end; the increment must go all-green.
#   TIER 2 -- honest-partial: gui, embedded, driver. These are recognized and
#             emitted (skeleton + build/compile check + unit tests) but CANNOT be
#             auto-verified in a headless environment (no display / no target
#             hardware / no privileged kernel). They are reported PARTIAL and
#             NEVER faked green; a plain-language PARTIAL.md names what a human
#             must still check.
#
# The generation GATE is COMPOSABLE and reuses existing policy -- it adds NO new
# knobs here on purpose:
#   * the severity gate reuses `review.thresholds` above (scaffold.generation_gate
#     calls the SAME scan.apply_thresholds; do NOT add a second thresholds block);
#   * the iterate cap reuses `max_iterations` above (every generation increment
#     passes through the eval/test loop, bounded by that hard cap);
#   * the anti-circularity gate reuses `eval_data.acceptance_criteria_gate`.
generate:
  supported_shapes:
    # TIER 1 -- fully build+run+test verified (must go all-green).
    - python_cli
    - python_library
    - python_web_api
    - cpp_console
    - cpp_library
    # TIER 2 -- generated-but-honestly-partial-verified (never faked green).
    - gui
    - embedded
    - driver

# orchestrate: Phase-4 ORCHESTRATOR policy -- the task-graph autonomy engine that
# REDUCES manual interaction by driving a larger goal (a feature on an existing
# project, or a greenfield app spec) through the EXISTING loops (ingest -> clarify
# -> modify -> test, the eval/iterate self-correction loop, the greenfield
# generation gate, the Phase-2 reviewer gate) as an ORDERED task graph, running
# autonomously between BATCHED human checkpoints and keeping a persistent,
# resumable run-state / audit log. It is semi-autonomous: "minimal interaction",
# NOT "no interaction" -- the human still approves at the batched checkpoints and
# the final apply, and nothing is auto-pushed (strictly local).
#
# MODEL vs OFF-MODEL SPLIT (same discipline as the engines above): the off-model
# engine (.apia/scripts/orchestrate.py) does ONLY the deterministic mechanics --
# build + validate the task graph, pick the ready topological frontier, detect
# cycles fail-loud, persist/reload a resumable run-state, enforce the global stop
# bound, and render the audit trail. It NEVER calls a model or network and NEVER
# itself executes the per-task work. The LIVE Copilot session does the per-task
# reasoning/generation/fix and the batched checkpoint conversation.
#
# This block adds NO duplicate knobs on purpose:
#   * the PER-TASK iteration cap REUSES `max_iterations` above (every code/test
#     task runs through the eval loop, bounded by that one hard cap -- there is
#     NO second per-task cap here);
#   * the severity gate reuses `review.thresholds`;
#   * the anti-circularity gate reuses `eval_data.acceptance_criteria_gate`.
#
#   global_max_tasks  the GLOBAL stop bound: the maximum number of tasks a single
#                     run may move to running/done before it HALTS fail-loud
#                     (surfaces where it stopped and asks) rather than grinding on
#                     indefinitely. Always a positive int. NOTE: this bounds tasks
#                     that have STARTED, not tasks that have COMPLETED -- a task
#                     counts against the budget the moment it moves to running and
#                     keeps counting through done/failed, so set the cap by how
#                     many tasks you want to allow to begin, not finish.
#   run_state_dir     where the resumable run-state / audit-log documents live.
#                     Relative to the .apia/ directory and COMMITTABLE (consistent
#                     with knowledge_dir above), so a long autonomous run survives
#                     sessions/windows and is shared with the team.
orchestrate:
  global_max_tasks: 20
  run_state_dir: runs/

# cpp: OPTIONAL per-project C++ overrides (a FALLBACK, never required). APIA
# detects the build system, test framework, and config first (see
# .apia/adapters/cpp.yml); it falls back to the keys below only on genuine doubt
# or for an unusual layout the detector gets wrong. Leave the block out entirely
# for the default CMake + GoogleTest + CTest path -- verify.py consults these
# keys only when present. All keys are optional:
#   build_dir             non-default CMake build directory (default: build)
#   cmake_path            absolute path to a specific cmake (default: on PATH)
#   build_config          Debug | Release (default: Debug for iteration)
#   build_system          cmake | msbuild to pin detection (default: detected)
#   test_command_override full ctest/vstest command string that wins over the
#                         adapter's default test_command
# cpp:
#   build_dir: build
#   cmake_path: null
#   build_config: Debug
#   build_system: cmake
#   test_command_override: null
