# APIA stack adapter: Python (Phase-1 primary, fully implemented).
#
# An adapter is a declarative command map that tells the APIA loop how to build,
# test, and author tests for a given stack. It contains NO model inference and
# issues NO network/LLM calls; it is read by the off-model scripts and by the
# Tier-2 skills/agents so stage behavior is stack-aware. See
# .apia/adapters/README.md for the schema contract.

name: python
primary: true          # Phase-1 primary stack
language: Python

# How the TEST stage runs the project's existing tests (regression guard) and
# any newly generated tests. Run from the repository root.
test_command: "python -m pytest"

# Glob(s) the ingester / tester use to discover test files for this stack.
test_discovery_glob:
  - "**/test_*.py"
  - "**/*_test.py"
  - "tests/**/*.py"

# How to decide a repo (or touched area) has "no tests" -> trigger the
# characterization-test path before modifying (legacy case). "No tests" means
# zero files match test_discovery_glob (equivalently, pytest collects 0 items).
no_tests_detection:
  # "No tests" means zero files match test_discovery_glob. pytest phrases a
  # zero-collection result as "collected 0 items" when it ran from testpaths, or
  # "no tests collected" / "no tests ran" when it fell back to recursive
  # discovery and still found nothing. verify.py recognizes all of these; the
  # value below is the primary signal.
  description: "No files match test_discovery_glob (pytest collects 0 items / no tests collected)."
  collect_command: "python -m pytest --collect-only -q"
  zero_tests_signal: "collected 0 items"

# Template reference used by the apia-test-authoring skill when it must generate
# characterization tests (pin current behavior) or new behavior tests. The path
# is relative to the package root; the skill resolves and fills it in.
characterization_test_template: ".github/skills/apia-test-authoring/templates/python_characterization_test.py.tmpl"

# Build / lint commands. Pure Python packages usually need no compile step; the
# optional lint command is advisory and only run when the tool is present.
build_command: null                 # no build step for a plain Python package
lint_command: "python -m pyflakes"  # advisory; skipped if pyflakes is absent

# Manifests that identify a Python project (mirrors ingest.py STACK_RULES).
manifests:
  - requirements.txt
  - "requirements*.txt"
  - pyproject.toml
  - setup.py
  - setup.cfg
  - Pipfile

# Source file extensions for this stack.
extensions:
  - ".py"

# Test frameworks recognized for this stack (first = default).
frameworks:
  - pytest
  - unittest

# ---------------------------------------------------------------------------
# Phase-2 REVIEWER scanners. Maps a finding category (security | quality | perf)
# to one or more declarative scanner definitions the off-model scan.py engine
# runs. Each scanner_def is {tool, command, format}:
#   tool    - human-readable scanner id (also used for doctor presence).
#   command - FULL command string. `python -m <mod>` is rewritten to run under
#             the SAME interpreter that launched scan.py (the project's .venv),
#             exactly like verify.py's test commands; a native binary or an
#             absolute path is run as-is.
#   format  - selects the normalizer (source_tool -> parser dispatch) that reads
#             the tool's machine-readable output into the canonical finding shape
#             {severity, category, file, line, rule, message, source_tool}.
# Scanners are ADVISORY: a missing tool degrades to a tool_unavailable marker
# (never a crash, never a fabricated finding). All scanners here are EXECUTED
# for real against samples/pyapp in the test suite (see test_scan.py). See
# .apia/adapters/README.md for the schema contract.
scanners:
  security:
    - tool: bandit
      command: "python -m bandit -r . -f json"
      format: bandit
    - tool: pip-audit
      # Audit the committed requirements file(s). Pointing at requirements.txt
      # keeps the audit deterministic and project-scoped (vs. sweeping the whole
      # ambient environment). The samples/pyapp fixture ships
      # requirements-vuln.txt with a known-vulnerable pin so this produces a
      # real asserted advisory; a project with no requirements file simply
      # yields zero findings. pip-audit resolves advisories from its own DB;
      # that is the SCANNER tool's behavior, never a scan.py model/LLM call.
      command: "python -m pip_audit -f json -r requirements-vuln.txt"
      format: pip_audit
  quality:
    - tool: ruff
      command: "python -m ruff check --output-format json ."
      format: ruff
    - tool: flake8
      command: "python -m flake8 ."
      format: flake8
  perf:
    - tool: radon
      command: "python -m radon cc -j ."
      format: radon

# ---------------------------------------------------------------------------
# OPTIONAL Layer-1 eval-data sections. These ground the self-correction loop in
# observable project behavior (not the agent's restatement of the request). They
# are OPTIONAL: an adapter without them simply offers no golden/characterization/
# invariant signal and the loop falls back to the differential delta. The runners
# that consume these keys land in a later feature; this adapter only declares the
# shape. See .apia/adapters/README.md for the schema.
# ---------------------------------------------------------------------------

# golden: committed golden-file comparison. The project treats the artifacts it
# produces (e.g. a generated CSV/JSON report) as the correctness truth; the loop
# diffs freshly produced artifacts against a committed golden tree.
golden:
  # Globs (relative to repo root) for produced artifacts the project treats as
  # correct output. Scoped to a conventional produced-output directory (out/)
  # so the mining targets the artifacts the project emits on purpose rather than
  # sweeping incidental *.json/*.csv elsewhere in the tree. Empty when the stack
  # has no golden artifacts to mine.
  artifact_glob:
    - "out/**/*.json"
    - "out/**/*.csv"
  # Committed golden tree holding the known-good copies of those artifacts. The
  # sample producer (samples/pyapp/calc/report.py) emits out/report.json and
  # out/table.csv and this tree holds the goldens (FEAT-004).
  golden_dir: "tests/golden"
  # How to compare produced vs. golden: bytes | text | json. `compare` may be a
  # single global string OR a PER-GLOB mapping (glob -> mode) when one block
  # mixes artifact kinds, so each kind is graded under a mode that is valid for
  # it. Here the JSON report is compared as structure (`json`, key-order and
  # whitespace insensitive) and the CSV table as newline-normalized `text`; a
  # single global mode cannot satisfy both (a CSV is not valid JSON). Globs with
  # no entry fall back to `default` (the language-neutral `bytes`). See
  # .apia/adapters/README.md for the schema.
  compare:
    "out/**/*.json": json
    "out/**/*.csv": text
    default: bytes

# characterization: pin the CURRENT observed behavior before modifying legacy
# code. `capture_command` runs the existing code and prints deterministic output
# to stdout; the captured output becomes the characterization baseline. null when
# the adapter has no generic capture command.
characterization:
  capture_command: null

# invariants: built-in structural properties that must always hold regardless of
# the specific request. The Layer-1 invariant runner recognizes the ids listed
# under `checks`; unknown ids are ignored.
invariants:
  description: "Structural properties the output must always satisfy."
  checks:
    - row_count_matches_input
    - no_nans
    - roundtrip_identity

# ---------------------------------------------------------------------------
# OPTIONAL Phase-3 GENERATION section. These are the minimal DETERMINISTIC
# emission facts the off-model generation engine (.apia/scripts/scaffold.py)
# consults when it emits a greenfield project of a given SHAPE. It is OPTIONAL
# and consistent with the sections above: scaffold.py's _adapter_fragment()
# reads `generate.templates.<shape>` (a dict per shape) WHEN PRESENT and falls
# back to its built-in templates otherwise, so an adapter without this section
# still generates correctly. Copilot writes the feature logic live; this block
# only records the mechanical facts (build-file template ref / inline skeleton
# fragment hints, the smoke/run command, and the unit-test template to seed).
# See .apia/adapters/README.md for the schema.
generate:
  templates:
    python_cli:
      # Build file emitted for a Python CLI: a stdlib-only pyproject.toml with a
      # pytest testpaths config (no runtime deps). Fragment hints name the
      # runnable entrypoint stub + importable package the engine lays down.
      build_file: pyproject.toml
      skeleton:
        - "<name>/__init__.py"           # package marker
        - "<name>/__main__.py"           # runnable `python -m <name>` entrypoint stub
      # Smoke/run command: the generated entrypoint is runnable via -m.
      run_command: "python -m {name}"
      # Unit-test template seeded under tests/ (imports the entrypoint + asserts
      # it returns a result). Run via the top-level test_command (pytest).
      test_template: tests/test_smoke.py
    python_library:
      build_file: pyproject.toml
      skeleton:
        - "<name>/__init__.py"           # importable package exposing an API stub
      # Libraries have no run entrypoint; the smoke signal is import + pytest.
      run_command: "python -c \"import {name}\""
      test_template: tests/test_smoke.py
    python_web_api:
      build_file: pyproject.toml
      skeleton:
        - "<name>/__init__.py"
        - "<name>/app.py"                # framework-agnostic health() smoke handler
      # Smoke the health handler without a running server (no web dependency).
      run_command: "python -c \"from {name}.app import health; print(health())\""
      test_template: tests/test_smoke.py
