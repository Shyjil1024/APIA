# APIA stack adapter: C++ (Phase-2, fully implemented to parity with python.yml).
#
# An adapter is a declarative command map that tells the APIA loop how to build,
# test, and author tests for a given stack. It contains NO model inference and
# issues NO network/LLM calls; it is read by the off-model scripts and by the
# Tier-2 skills/agents so stage behavior is stack-aware. See
# .apia/adapters/README.md for the schema contract.
#
# This adapter is ADAPTIVE, not hard-coded to any one project. The top-level
# test_command/build_command are the portable CMake + CTest defaults (so a plain
# `verify.py <repo> --adapter cpp.yml` works on the proof sample). The
# `build_systems` and `test_frameworks` sections below are what FEAT-003 selects
# from once ingest has detected the project's real facts (CMake vs MSBuild;
# GoogleTest / Catch2 / Boost.Test / CTest / VSTest). All commands are treated
# as full strings so absolute tool paths (e.g. a full path to msbuild.exe) are
# tolerated as-is.

name: cpp
primary: false
language: C++

# How the TEST stage runs the project's existing tests (regression guard) and
# any newly generated tests. Run from the repository root. Default is the
# portable CMake + CTest path; FEAT-003 overrides this from `test_frameworks`
# when a non-CTest framework/build system is detected.
test_command: "ctest --test-dir build --output-on-failure"

# Glob(s) the ingester / tester use to discover test files for this stack.
test_discovery_glob:
  - "**/*_test.cpp"
  - "**/test_*.cpp"
  - "test/**/*.cpp"
  - "tests/**/*.cpp"

# How to decide a repo (or touched area) has "no tests" -> trigger the
# characterization-test path before modifying (legacy case). "No tests" means
# zero files match test_discovery_glob (equivalently, CTest lists 0 tests).
no_tests_detection:
  description: "No files match test_discovery_glob (CTest lists 0 tests: 'Total Tests: 0')."
  collect_command: "ctest --test-dir build -N"
  zero_tests_signal: "Total Tests: 0"

# Template reference used by the apia-test-authoring skill when it must generate
# characterization tests (pin current behavior) or new behavior tests. The path
# is relative to the package root; the skill resolves and fills it in.
characterization_test_template: ".github/skills/apia-test-authoring/templates/cpp_characterization_test.cpp.tmpl"

# Build / compile command. Default is the portable CMake configure+build; the
# `build_systems` section carries the per-build-system detail FEAT-003 selects.
build_command: "cmake -S . -B build && cmake --build build"

# Advisory lint command; skipped if the tool is absent. clang-tidy needs a
# compile database (CMAKE_EXPORT_COMPILE_COMMANDS); treated as best-effort.
lint_command: "clang-tidy"

# Manifests that identify a C++ project (mirrors ingest.py STACK_RULES['cpp']).
manifests:
  - CMakeLists.txt
  - conanfile.txt
  - conanfile.py
  - Makefile

# Source file extensions for this stack (mirrors ingest.py STACK_RULES['cpp']).
extensions:
  - ".cpp"
  - ".cc"
  - ".cxx"
  - ".hpp"
  - ".hh"
  - ".h"

# Test frameworks recognized for this stack (first = default). See
# `test_frameworks` below for the per-framework run command + result_format.
frameworks:
  - googletest
  - catch2
  - ctest
  - boost_test
  - vstest

# ---------------------------------------------------------------------------
# ADAPTIVE build systems. FEAT-002 detection picks one by inspecting manifests
# (CMakeLists.txt -> cmake; a .sln/.vcxproj -> msbuild). FEAT-003 assembles the
# configure/build commands from the selected entry. `config` selects the build
# configuration (Debug for characterization/iteration, Release for a final
# regression check). Commands are full strings, so an absolute tool path (e.g.
# "/opt/cmake/bin/cmake" or "C:/.../msbuild.exe") drops in unchanged.
# ---------------------------------------------------------------------------
build_systems:
  cmake:
    detect_manifests:
      - CMakeLists.txt
    build_dir: build
    config: Debug            # default working config; use Release for final guard
    configs:
      - Debug
      - Release
    configure_command: "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug"
    build_command: "cmake --build build --config Debug"
    # Multi-config generators (e.g. Visual Studio) ignore CMAKE_BUILD_TYPE at
    # configure time and honor --config at build time; single-config generators
    # (Makefiles/Ninja) honor CMAKE_BUILD_TYPE. Keeping both is portable.
  msbuild:
    detect_manifests:
      - "*.sln"
      - "*.vcxproj"
    build_dir: null          # MSBuild builds in-tree; no separate build dir
    config: Debug
    configs:
      - Debug
      - Release
    # NOTE: no MSVC/MSBuild toolchain exists in the Linux sandbox; this path is
    # command-assembly only (unit-tested against fixture strings by FEAT-003),
    # never executed here. `msbuild` may be an absolute path to msbuild.exe.
    configure_command: null  # MSBuild has no separate configure step
    build_command: "msbuild /t:Build /p:Configuration=Debug"

# ---------------------------------------------------------------------------
# ADAPTIVE test frameworks. FEAT-003 selects an entry from the framework ingest
# detected and uses `run_command` to execute tests + `result_format` to decide
# which output parser to apply (ctest | gtest | msbuild). `zero_tests_signal`
# is the substring that means "no tests were run" for that runner.
# ---------------------------------------------------------------------------
test_frameworks:
  # GoogleTest discovered + driven by CTest (the proof sample's path).
  googletest:
    run_command: "ctest --test-dir build --output-on-failure"
    collect_command: "ctest --test-dir build -N"
    result_format: ctest
    zero_tests_signal: "Total Tests: 0"
  # Catch2 registered with CTest via catch_discover_tests.
  catch2:
    run_command: "ctest --test-dir build --output-on-failure"
    collect_command: "ctest --test-dir build -N"
    result_format: ctest
    zero_tests_signal: "Total Tests: 0"
  # Plain CTest (any tests registered via add_test), framework-agnostic.
  ctest:
    run_command: "ctest --test-dir build --output-on-failure"
    collect_command: "ctest --test-dir build -N"
    result_format: ctest
    zero_tests_signal: "Total Tests: 0"
  # Running a GoogleTest binary directly (no CTest) -> parse gtest console output.
  gtest_binary:
    run_command: "./build/tests --gtest_color=no"
    collect_command: "./build/tests --gtest_list_tests"
    result_format: gtest
    zero_tests_signal: "[==========] Running 0 tests"
  # Boost.Test, typically registered with CTest.
  boost_test:
    run_command: "ctest --test-dir build --output-on-failure"
    collect_command: "ctest --test-dir build -N"
    result_format: ctest
    zero_tests_signal: "Total Tests: 0"
  # MSVC VSTest for MSBuild projects. Command-assembly only in this sandbox
  # (no VSTest toolchain); `vstest.console.exe` may be an absolute path.
  vstest:
    run_command: "vstest.console.exe build/Debug/tests.dll"
    collect_command: "vstest.console.exe build/Debug/tests.dll /ListTests"
    result_format: msbuild
    zero_tests_signal: "Total tests: 0"

# ---------------------------------------------------------------------------
# Phase-2 REVIEWER scanners (same schema as python.yml; see
# .apia/adapters/README.md). Maps a finding category to one or more scanner
# definitions {tool, command, format} the off-model scan.py engine runs. Each
# command is a FULL string, so an absolute tool path (e.g. a full path to
# clang-tidy) drops in unchanged; cppcheck/clang-tidy are NATIVE binaries (no
# `python -m` rewrite). cppcheck emits XML v2 on stderr; its own per-finding
# severity decides the category (performance -> perf, hard error -> security,
# style/warning -> quality), so one cppcheck run feeds several categories.
#
# EXECUTED-HERE vs COMMAND-ASSEMBLY-ONLY (same honesty discipline as the MSBuild
# notes above): in this sandbox cppcheck (2.22.0) and clang-tidy (LLVM) ARE
# present and are EXECUTED for real against samples/cppapp in the test suite
# (see test_scan.py). clang-tidy needs a compile database; the `-p build`
# invocation below is command-assembly for the compile-database path, while the
# executed test drives clang-tidy directly on the smelly source with explicit
# flags. A MISSING tool on another host degrades to a tool_unavailable marker.
# cppcheck is scoped to the project's SOURCE directories (`src include`) rather
# than `.` on purpose: a `.` sweep drags in the gitignored CMake `build/` tree
# (vendored GoogleTest etc.) and buries the project's own smells under thousands
# of third-party-dependency parse artifacts -- the same "scope to the project's
# own tree, not generated output" discipline the golden `artifact_glob` uses.
#
# cppcheck is declared ONCE (under `security` as the entry point) and SELF-
# CATEGORIZES: a single `--enable=all` run emits security (hard errors, e.g.
# uninitvar/memleak), quality (style/warning), and perf (performance) findings,
# and the normalizer routes each finding to the right category by cppcheck's own
# severity kind. Declaring it once therefore covers all three categories without
# duplicating the same findings; the empty `quality`/`perf` entries below note
# this (clang-tidy adds extra quality findings).
scanners:
  security:
    - tool: cppcheck
      command: "cppcheck --enable=all --xml --xml-version=2 src include"
      format: cppcheck
  quality:
    # clang-tidy with a compile database (-p build). Command-assembly for the
    # compile-database path; executed directly on sources in the test suite.
    # (cppcheck's quality findings come from the self-categorizing run above.)
    - tool: clang-tidy
      command: "clang-tidy -p build src/smelly.cpp"
      format: clang_tidy

# ---------------------------------------------------------------------------
# OPTIONAL Layer-1 eval-data sections. These ground the self-correction loop in
# observable project behavior (not the agent's restatement of the request). They
# are OPTIONAL: an adapter without them simply offers no golden/characterization/
# invariant signal and the loop falls back to the differential delta. The runners
# that consume these keys land in a later feature; this adapter only declares the
# shape. See .apia/adapters/README.md for the schema.
# ---------------------------------------------------------------------------

# golden: committed golden-file comparison. The project treats the artifacts it
# produces (e.g. a generated report or rendered image) as the correctness truth;
# the loop diffs freshly produced artifacts against a committed golden tree.
golden:
  # Globs (relative to repo root) for produced artifacts the project treats as
  # correct output. Scoped to a conventional produced-output directory (out/)
  # so the mining never sweeps the generated CMake build tree (build/ holds
  # tool-emitted *.json such as compile_commands.json / Labels.json that have no
  # golden counterpart). Empty when the stack has no golden artifacts to mine.
  artifact_glob:
    - "out/**/*.json"
    - "out/**/*.csv"
    - "out/**/*.png"
  # Committed golden tree holding the known-good copies of those artifacts. The
  # sample producer (samples/cppapp/src/report_main.cpp) emits out/report.json
  # and this tree holds the byte-exact golden (FEAT-004).
  golden_dir: "tests/golden"
  # How to compare produced vs. golden: bytes | text | json. Default is the
  # language-neutral `bytes` (exact match), which suits binary artifacts (e.g.
  # a rendered .png); `text` normalizes line endings; `json` compares structure.
  compare: bytes

# characterization: pin the CURRENT observed behavior before modifying legacy
# code. `capture_command` runs the existing code and prints deterministic output
# to stdout; the captured output becomes the characterization baseline. null when
# the adapter has no generic capture command (the C++ default: behavior is pinned
# via GoogleTest/CTest rather than a stdout capture).
characterization:
  capture_command: null

# invariants: built-in structural properties that must always hold regardless of
# the specific request. The Layer-1 invariant runner recognizes the ids listed
# under `checks`; unknown ids are ignored.
invariants:
  description: "Structural properties the output must always satisfy."
  checks:
    - row_count_matches_input
    - no_nans
    - roundtrip_identity

# ---------------------------------------------------------------------------
# OPTIONAL Phase-3 GENERATION section. The minimal DETERMINISTIC emission facts
# the off-model generation engine (.apia/scripts/scaffold.py) consults when it
# emits a greenfield C++ project of a given SHAPE. OPTIONAL and consistent with
# the sections above: scaffold.py's _adapter_fragment() reads
# `generate.templates.<shape>` (a dict per shape) WHEN PRESENT and falls back to
# its built-in templates otherwise. The CMakeLists template mirrors
# samples/cppapp: a library target holds the logic, GoogleTest is fetched via
# FetchContent, and gtest_discover_tests registers the suite with CTest -- so a
# generated project builds + tests with the portable `build_systems.cmake` +
# `test_frameworks.googletest` path above, no extra toolchain. The build command
# REUSES build_systems.cmake; the test template is a GoogleTest smoke suite. See
# .apia/adapters/README.md for the schema.
generate:
  templates:
    cpp_console:
      # CMakeLists emitted for a C++ console app: library target + console
      # executable that links it + GoogleTest via FetchContent (mirrors
      # samples/cppapp). Fragment hints name the sources the engine lays down.
      build_file: CMakeLists.txt
      skeleton:
        - "src/main.cpp"                 # console entrypoint linking the library
        - "src/<name>_lib.cpp"           # library source (app:: smoke stub)
        - "include/<name>_lib.h"         # public header (app:: namespace)
      # Build REUSES the adaptive cmake build system declared above.
      build_command: "cmake -S . -B build && cmake --build build"
      # Smoke/run: the built console executable prints its stub result.
      run_command: "./build/{name}"
      # GoogleTest smoke suite registered with CTest (test_frameworks.googletest).
      test_template: tests/test_smoke.cpp
    cpp_library:
      build_file: CMakeLists.txt
      skeleton:
        - "src/<name>_lib.cpp"           # library source (app:: smoke stub)
        - "include/<name>_lib.h"         # public header (app:: namespace)
      build_command: "cmake -S . -B build && cmake --build build"
      # Libraries have no runnable binary; the smoke signal is the test suite.
      run_command: "ctest --test-dir build --output-on-failure"
      test_template: tests/test_smoke.cpp

# ---------------------------------------------------------------------------
# OPTIONAL per-project override (FALLBACK, not a requirement).
#
# DETECT FIRST: APIA detects the build system, framework, and config above and
# only falls back here on genuine doubt. If detection is wrong for an unusual
# layout, a project may pin values in .apia/config.yml under a `cpp:` block,
# e.g.:
#
#   cpp:
#     build_dir: out            # non-default CMake build directory
#     cmake_path: /opt/cmake/bin/cmake
#     config: Release
#     test_command_override: "ctest --test-dir out --output-on-failure"
#
# These keys are intentionally left commented here: they are a documented
# escape hatch, consumed only when present, never required for the default
# CMake + GoogleTest + CTest path to work.
# override:
#   build_dir: null
#   cmake_path: null
#   config: null
#   test_command_override: null
